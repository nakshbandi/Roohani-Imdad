name: Build Roohani Imdad Secure Spark APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Roohani_Imdad_SECURE_SPARK_BUILD.zip'
      - '.github/workflows/build-secure-spark.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract secure Spark project
        run: |
          unzip -q Roohani_Imdad_SECURE_SPARK_BUILD.zip
          cd Roohani_Imdad_Secure_Production
          test -f app/google-services.json
          test -f firestore/firestore.rules
          grep -q 'com.roohaniimdad.eraseed' app/google-services.json
          ! grep -Rqi 'firebase-functions\|getHttpsCallable\|FirebaseFunctions' app
      - name: Fix Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Roohani_Imdad_Secure_Production/build.gradle")
          s = p.read_text()
          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "id 'com.android.application' version '8.7.3' apply false",
                  "id 'com.android.application' version '8.7.3' apply false\n"
                  "    id 'com.google.gms.google-services' version '4.4.4' apply false"
              )
              p.write_text(s)
          PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build secure APK
        working-directory: Roohani_Imdad_Secure_Production
        run: gradle --no-daemon assembleDebug

      - name: Upload secure APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-SECURE-SPARK-APK
          path: Roohani_Imdad_Secure_Production/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Firestore rules
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-Firestore-Rules
          path: Roohani_Imdad_Secure_Production/firestore/firestore.rules
