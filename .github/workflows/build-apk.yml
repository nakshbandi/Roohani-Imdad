name: Build Roohani Imdad APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Grand Final project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q Roohani_Imdad_GRAND_FINAL_GREEN_RECEIPT_ARABIC_FOOTER_IMAGE_RECEIPT.zip -d buildsrc

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find buildsrc -name app -type d -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          echo "Grand Final source verified."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Grand Final APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Grand Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-GRAND-FINAL-APK
          path: buildsrc/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
