name: Build Roohani Imdad APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Hinglish Android project
        run: |
          mkdir buildsrc
          unzip -q Roohani_Imdad_Hinglish_VERIFIED_v2.zip -d buildsrc
        - name: Verify Hinglish source
          run: |
            grep -R "New Raseed" buildsrc/Roohani_Imdad_Hinglish_FIXED
            if grep -R -P '[\x{0900}-\x{097F}]' buildsrc/Roohani_Imdad_Hinglish_FIXED; then
              echo "ERROR: Hindi/Devanagari text found!"
              exit 1
            fi
            echo "OK: Hinglish source verified"

        - name: Clean old APK
          run: |
            rm -rf buildsrc/Roohani_Imdad_Hinglish_FIXED/app/build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: buildsrc/Roohani_Imdad_Hinglish_FIXED
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-APK
          path: buildsrc/Roohani_Imdad_Hinglish_FIXED/app/build/outputs/apk/debug/app-debug.apk
