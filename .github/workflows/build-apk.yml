name: Build Roohani Imdad APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FINAL project
        run: |
          mkdir -p buildsrc
          unzip -q Roohani_Imdad_FINAL_v4_UPI_Print_Share.zip -d buildsrc

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find buildsrc -name settings.gradle -type f -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=$(dirname "$(find buildsrc -name build.gradle -type f -print -quit)")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Verify FINAL source
        run: |
          echo "Checking FINAL source..."

          grep -R "New Raseed" "$PROJECT_DIR" || {
            echo "ERROR: New Raseed text not found!"
            exit 1
          }

          grep -R "Donor Name" "$PROJECT_DIR" || {
            echo "ERROR: Donor Name text not found!"
            exit 1
          }

          grep -R "Reports" "$PROJECT_DIR" || {
            echo "ERROR: Reports text not found!"
            exit 1
          }

          if grep -R -P '[\x{0900}-\x{097F}]' "$PROJECT_DIR"; then
            echo "ERROR: Hindi/Devanagari text found!"
            exit 1
          fi

          echo "OK: FINAL Hinglish source verified"

      - name: Clean old APK
        run: |
          rm -rf "$PROJECT_DIR/app/build"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build FINAL APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug

      - name: Check APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" -type f -print -quit)
          test -n "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-FINAL-APK
          path: buildsrc/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
