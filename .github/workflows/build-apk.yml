name: Build Roohani Imdad APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FINAL v7 project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q Roohani_Imdad_FINAL_v7_PASSWORD_CHANGE_FIXED.zip -d buildsrc

      - name: Verify FINAL v7 source
        run: |
          PROJECT_DIR="buildsrc/Roohani_Imdad_Hinglish_FIXED"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "Password" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "generateUpiQr" "$PROJECT_DIR/app/src/main/assets/index.html"
          echo "FINAL v7 source verified."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build FINAL v7 APK
        working-directory: buildsrc/Roohani_Imdad_Hinglish_FIXED
        run: gradle assembleDebug

      - name: Upload FINAL v7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-FINAL-v7-APK
          path: buildsrc/Roohani_Imdad_Hinglish_FIXED/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
