name: Build Roohani Imdad GRAND FINAL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Roohani_Imdad_GRAND_FINAL.zip'
      - '.github/workflows/build-grand-final.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate GRAND FINAL project
        run: |
          set -euo pipefail
          test -f Roohani_Imdad_GRAND_FINAL.zip
          unzip -q Roohani_Imdad_GRAND_FINAL.zip
          cd Roohani_Imdad_Secure_Production
          test -f app/google-services.json
          test -f firestore/firestore.rules
          grep -q "com.roohaniimdad.eraseed" app/google-services.json
          grep -q "com.google.gms.google-services' version '4.4.4'" build.gradle
          grep -q 'upi://pay?pa=' app/src/main/java/com/roohaniimdad/eraseed/MainActivity.java
          grep -q 'function cancelRaseed' app/src/main/assets/index.html
          grep -q 'function handleAndroidBack' app/src/main/assets/index.html
          grep -q "allow create: if (isAdmin() || isCollector())" firestore/firestore.rules
          ! grep -Rqi 'firebase-functions\|getHttpsCallable\|FirebaseFunctions' app

      - name: Validate HTML JavaScript
        working-directory: Roohani_Imdad_Secure_Production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks, 'No script block found'
          Path('/tmp/index.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/index.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (runner preinstalled SDK)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build GRAND FINAL APK
        working-directory: Roohani_Imdad_Secure_Production
        run: gradle --no-daemon clean assembleDebug

      - name: Upload GRAND FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-GRAND-FINAL-APK
          path: Roohani_Imdad_Secure_Production/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Firestore rules
        uses: actions/upload-artifact@v4
        with:
          name: Roohani-Imdad-GRAND-FINAL-Firestore-Rules
          path: Roohani_Imdad_Secure_Production/firestore/firestore.rules
          if-no-files-found: error
