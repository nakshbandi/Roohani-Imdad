<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roohani Imdad E-Raseed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    .app-header { background-color: #007a4d; color: white; padding: 15px; border-radius: 0 0 15px 15px; }
    .card-custom { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .btn-emerald { background-color: #007a4d; color: white; }
    .btn-emerald:hover { background-color: #00613d; color: white; }
  </style>
</head>
<body>

  <div class="app-header text-center mb-3">
    <h3 class="fw-bold m-0">Roohani Imdad E-Raseed</h3>
    <small>Secure Online Donation • Receipt • Reports</small>
  </div>

  <div class="container pb-5" id="appContent">
    <!-- Login View -->
    <div id="loginSection" class="card card-custom p-4 mx-auto" style="max-width: 400px;">
      <h4 class="fw-bold mb-3">Secure Login</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-emerald w-100 fw-bold py-2">Login</button>
      </form>
    </div>

    <!-- Main Navigation View (Hidden by default) -->
    <div id="mainSection" class="d-none">
      <ul class="nav nav-pills nav-fill mb-3 bg-white p-2 rounded-3 shadow-sm" id="mainTabs">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('raseed')">New Raseed</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('history')">History</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('reports')">Reports</a></li>
        <li class="nav-item" id="collectorsTabNav"><a class="nav-link" href="#" onclick="switchTab('collectors')">Collectors</a></li>
      </ul>

      <!-- Collectors Section -->
      <div id="collectorsView" class="tab-content-view d-none">
        <h3 class="fw-bold mb-3">Collectors</h3>
        <div class="card card-custom p-4 mb-4">
          <h5 class="fw-bold mb-3">New Collector Add Karein</h5>
          <form id="addCollectorForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Collector Name *</label>
              <input type="text" id="collectorName" class="form-control" placeholder="Full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Username *</label>
              <input type="text" id="collectorUsername" class="form-control" placeholder="e.g. waseem01" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password *</label>
              <input type="password" id="collectorPassword" class="form-control" placeholder="At least 8 characters" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm Password *</label>
              <input type="password" id="collectorConfirmPassword" class="form-control" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-emerald w-100 fw-bold py-2">Add Collector</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
