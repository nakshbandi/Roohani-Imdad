<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roohani Imdad E-Raseed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { 
      background-color: #eef2f5; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    .app-header { 
      background: linear-gradient(135deg, #006838 0%, #004d28 100%); 
      color: white; 
      padding: 22px 15px; 
      border-radius: 0 0 20px 20px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .card-custom { 
      border: none;
      border-radius: 16px; 
      box-shadow: 0 6px 18px rgba(0,0,0,0.06); 
      background: #ffffff;
    }
    .btn-emerald { 
      background: linear-gradient(135deg, #008751 0%, #006838 100%); 
      color: white; 
      border: none;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .btn-emerald:hover { 
      background: linear-gradient(135deg, #006838 0%, #004d28 100%); 
      color: white; 
      box-shadow: 0 4px 12px rgba(0,135,81,0.3);
    }
    .form-control {
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid #ced4da;
    }
    .form-control:focus {
      border-color: #008751;
      box-shadow: 0 0 0 0.2rem rgba(0, 135, 81, 0.25);
    }
    .nav-pills .nav-link.active {
      background-color: #008751 !important;
      border-radius: 10px;
    }
    .nav-pills .nav-link {
      color: #006838;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-header text-center mb-4">
    <h3 class="fw-bold m-0" style="letter-spacing: 0.5px;">Roohani Imdad E-Raseed</h3>
    <small style="opacity: 0.9;">Secure Online Donation • Receipt • Reports</small>
  </div>

  <div class="container pb-5" id="appContent">
    <!-- Login View -->
    <div id="loginSection" class="card card-custom p-4 mx-auto" style="max-width: 400px;">
      <h4 class="fw-bold mb-3 text-center" style="color: #006838;">Secure Login</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-emerald w-100 fw-bold py-2 mt-2">Login</button>
      </form>
    </div>

    <!-- Main Navigation View (Hidden by default) -->
    <div id="mainSection" class="d-none">
      <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded-3 shadow-sm" id="mainTabs">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('raseed')">New Raseed</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('history')">History</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('reports')">Reports</a></li>
        <li class="nav-item" id="collectorsTabNav"><a class="nav-link" href="#" onclick="switchTab('collectors')">Collectors</a></li>
      </ul>

      <!-- Collectors Section -->
      <div id="collectorsView" class="tab-content-view d-none">
        <h3 class="fw-bold mb-3" style="color: #006838;">Collectors</h3>
        <div class="card card-custom p-4 mb-4">
          <h5 class="fw-bold mb-3" style="color: #008751;">New Collector Add Karein</h5>
          <form id="addCollectorForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Collector Name *</label>
              <input type="text" id="collectorName" class="form-control" placeholder="Full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Username *</label>
              <input type="text" id="collectorUsername" class="form-control" placeholder="e.g. waseem01" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password *</label>
              <input type="password" id="collectorPassword" class="form-control" placeholder="At least 8 characters" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm Password *</label>
              <input type="password" id="collectorConfirmPassword" class="form-control" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-emerald w-100 fw-bold py-2 mt-2">Add Collector</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
