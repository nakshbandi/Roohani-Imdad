<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roohani Imdad E-Raseed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #f0f4f2; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .app-header { background: linear-gradient(135deg, #006838 0%, #004d28 100%); color: white; padding: 20px 15px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); }
    .card-custom { border: none; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); background: #ffffff; }
    .btn-emerald { background: linear-gradient(135deg, #008751 0%, #006838 100%); color: white; border: none; border-radius: 10px; font-weight: 600; transition: all 0.3s ease; }
    .btn-emerald:hover { background: linear-gradient(135deg, #006838 0%, #004d28 100%); color: white; box-shadow: 0 4px 12px rgba(0,135,81,0.3); }
    .form-control, .form-select { border-radius: 10px; padding: 11px 14px; border: 1px solid #dcdfe3; }
    .form-control:focus, .form-select:focus { border-color: #008751; box-shadow: 0 0 0 0.2rem rgba(0, 135, 81, 0.2); }
    .nav-pills .nav-link.active { background-color: #008751 !important; border-radius: 10px; font-weight: 600; }
    .nav-pills .nav-link { color: #006838; font-weight: 600; }
  </style>
</head>
<body>

  <div class="app-header text-center mb-4">
    <h3 class="fw-bold m-0" style="letter-spacing: 0.5px;">Roohani Imdad E-Raseed</h3>
    <small style="opacity: 0.9;">Secure Online Donation • Receipt • Reports</small>
  </div>

  <div class="container pb-5" id="appContent">
    <!-- Login View -->
    <div id="loginSection" class="card card-custom p-4 mx-auto" style="max-width: 400px;">
      <h4 class="fw-bold mb-3 text-center" style="color: #006838;">Secure Login</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-emerald w-100 py-2 mt-2">Login</button>
      </form>
    </div>

    <!-- Main Navigation View -->
    <div id="mainSection" class="d-none">
      <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded-3 shadow-sm" id="mainTabs">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('raseed', event)">New Raseed</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('history', event)">History</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('reports', event)">Reports</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('settings', event)">Settings</a></li>
        <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">Logout</a></li>
      </ul>

      <!-- New Donation Raseed View -->
      <div id="raseedView" class="tab-content-view">
        <h3 class="fw-bold mb-3" style="color: #006838;">New Donation Raseed</h3>
        <div class="card card-custom p-4">
          <form id="raseedForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Donor Name *</label>
              <input type="text" id="donorName" class="form-control" placeholder="Full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mobile</label>
              <input type="text" id="donorMobile" class="form-control" placeholder="Mobile number">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Amount (₹) *</label>
              <input type="number" id="donorAmount" class="form-control" placeholder="Amount" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Donation Type</label>
              <select id="donationType" class="form-select">
                <option value="Zakat">Zakat</option>
                <option value="Lillah">Lillah</option>
                <option value="Sadqa">Sadqa</option>
                <option value="General Imdad">General Imdad</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Payment Mode</label>
              <select id="paymentMode" class="form-select">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Note</label>
              <textarea id="donorNote" class="form-control" placeholder="Optional notes" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-emerald w-100 py-2 fw-bold">Generate Raseed</button>
          </form>
        </div>
      </div>

      <!-- History View -->
      <div id="historyView" class="tab-content-view d-none">
        <h3 class="fw-bold mb-3" style="color: #006838;">History</h3>
        <div id="historyList" class="card card-custom p-4 text-center">
          <p class="text-muted m-0">No records found.</p>
        </div>
      </div>

      <!-- Reports View -->
      <div id="reportsView" class="tab-content-view d-none">
        <h3 class="fw-bold mb-3" style="color: #006838;">Reports</h3>
        <div class="card card-custom p-4 text-center">
          <p class="text-muted m-0">Reports data loading...</p>
        </div>
      </div>

      <!-- Settings View -->
      <div id="settingsView" class="tab-content-view d-none">
        <h3 class="fw-bold mb-3" style="color: #006838;">Settings</h3>
        <div class="card card-custom p-4">
          <p class="text-muted m-0">App Settings & Configuration.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabName, event) {
      const views = document.querySelectorAll('.tab-content-view');
      views.forEach(v => v.classList.add('d-none'));

      const links = document.querySelectorAll('#mainTabs .nav-link');
      links.forEach(l => l.classList.remove('active'));

      if (tabName === 'raseed') {
        document.getElementById('raseedView').classList.remove('d-none');
      } else if (tabName === 'history') {
        document.getElementById('historyView').classList.remove('d-none');
      } else if (tabName === 'reports') {
        document.getElementById('reportsView').classList.remove('d-none');
      } else if (tabName === 'settings') {
        document.getElementById('settingsView').classList.remove('d-none');
      }
      
      if (event && event.target) {
        event.target.classList.add('active');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('loginSection').classList.add('d-none');
      document.getElementById('mainSection').classList.remove('d-none');
    });

    function logout() {
      document.getElementById('mainSection').classList.add('d-none');
      document.getElementById('loginSection').classList.remove('d-none');
    }
  </script>

</body>
  </html>
